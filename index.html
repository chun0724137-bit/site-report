<style>
/* Layout: one-column phone app. Sticky project bar on top, four views switched by a bottom tab bar, big thumb-sized buttons. */
:root{
  --bg:#eef0ee; --card:#ffffff; --ink:#1c2a33; --mute:#5f6e77; --line:#d3d9d6;
  --accent:#0f6e6a; --accent-ink:#ffffff; --soft:#dcebe8; --warn:#b4530b; --warn-bg:#fbe9d2; --ok:#22703a; --ok-bg:#dff1e3;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"SF Mono","Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191c; --card:#1c262b; --ink:#e6ecea; --mute:#9aa8ad; --line:#33424a;
  --accent:#4fb8ae; --accent-ink:#082522; --soft:#213b3a; --warn:#f0a35a; --warn-bg:#43301a; --ok:#7fd096; --ok-bg:#1d3a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191c; --card:#1c262b; --ink:#e6ecea; --mute:#9aa8ad; --line:#33424a;
  --accent:#4fb8ae; --accent-ink:#082522; --soft:#213b3a; --warn:#f0a35a; --warn-bg:#43301a; --ok:#7fd096; --ok-bg:#1d3a26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:max-width .18s ease}
html[data-layout="desktop"] .wrap{max-width:1180px}
@media (min-width:860px){
  html[data-layout="desktop"] main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  html[data-layout="desktop"] main>.seg,html[data-layout="desktop"] main>.msg,html[data-layout="desktop"] main>.btn.block,html[data-layout="desktop"] main>.full-span,html[data-layout="desktop"] main>section.card:only-of-type{grid-column:1/-1}
  html[data-layout="desktop"] .items{grid-template-columns:repeat(3,minmax(0,1fr))}
}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}

select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=number],textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 130px;min-width:0}

.date-by-row>.f{min-width:0;width:100%;overflow:hidden}
.date-by-row input,.date-by-row input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100%;max-width:100%;box-sizing:border-box;height:40px;margin:0}

.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}

.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}

.entry span{flex:1;min-width:0}

.sheet{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sheet .t{font-weight:700}
.big{font-size:22px!important;font-family:var(--num);text-align:right}
.note{font-size:13px;color:var(--mute)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.msg{padding:10px 12px;border-radius:8px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}

.proj{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px}

.cat{font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}
.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip.crewn{grid-column:span 2}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.chip{display:flex;justify-content:space-between;align-items:center;gap:2px;padding:12px 6px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:48px}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mc{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:14px;color:var(--ink)}
.mc .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .mr{display:flex;align-items:center;justify-content:space-between;gap:4px}
.mc .mr b{font-family:var(--num)}
.mc .mr button{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:18px}
.mc .mr button.x{border:0;background:none;color:var(--warn)}
.chip.crewn input{width:60px;padding:6px;text-align:right;font-family:var(--num)}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--soft);font-size:14px}
.chip[data-v="1"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip[data-v="0.5"]{background:var(--soft);border-color:var(--accent);font-weight:600}
.cal td:first-child,.cal th:first-child{position:sticky;left:0;background:var(--card)}
.cal tbody tr{cursor:pointer}
.cal tr.on td{background:var(--soft)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);text-decoration:none}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--line)}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pct{font-family:var(--num);font-size:28px;font-weight:700}
img.th{width:44px;height:44px;object-fit:cover;border-radius:6px}
.dcard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.dcard:hover{border-color:var(--accent)}
.dcard.open{border:2px solid var(--accent);background:var(--soft)}
.dcard .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dcard .dw{font-size:14px;color:var(--ink);font-weight:500;line-height:1.4}
.dbody{display:flex;flex-direction:column;gap:12px;padding:14px;border:2px solid var(--accent);border-top:0;border-radius:0 0 12px 12px;margin-top:-10px;background:var(--card)}
.wo-card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.lb-backdrop{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;gap:12px;color:#fff}
.lb-backdrop img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:8px;background:#111}
.lb-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:600px}
</style>

<header><div class="wrap"><b>現場回報</b><select id="proj" aria-label="工程"></select><span style="flex:1"></span><button id="viewModeBtn" type="button" class="btn" style="padding:6px 10px;font-size:13px;white-space:nowrap" title="切換手機版 / 電腦版畫面">📱 手機版</button><button id="exitBoss" type="button" class="btn primary" hidden style="margin-left:6px;padding:8px 12px;font-size:14px">← 回到現場回報</button><button id="logout" type="button" class="btn" hidden style="margin-left:6px;padding:8px 12px;font-size:14px">登出</button></div></header>
<div class="wrap"><main id="main"><section class="card"><p class="note" id="boot">讀取工程資料中…</p></section></main></div>
<nav><div class="wrap">
  <button data-v="report">回報</button><button data-v="diary">日誌</button><button data-v="log">紀錄</button><button data-v="all">總覽</button><button data-v="set">設定</button>
</div></nav>

<script>
const $=(s,r=document)=>r.querySelector(s), h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else if(a[k]!==null&&a[k]!==undefined&&a[k]!==false)e.setAttribute(k,a[k]===true?"":a[k]);}for(const x of c.flat()){if(x===null||x===undefined||x===false)continue;e.append(x.nodeType?x:document.createTextNode(String(x)));}return e;};
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const WX=["晴","陰","雨"], METHODS=["測距儀","捲尺"], NOWORK_REASONS=["週日休假","雨天停工","國定假日","待料/停工"], DEFAULT_SAMPLES=["混凝土","鋼筋","CLSM","格柵"], CONCRETE_SPECS=["140kgf/cm2","210kgf/cm2","280kgf/cm2"], REBAR_SPECS=["D10(#3)","D13(#4)","D16(#5)","D19(#6)","D22(#7)","D25(#8)","D29(#9)","D32(#10)"], REMOVED_WORKS=["配管","配線","AC清運","AC破碎","路緣石施工"], DEFAULT_NOTES=["安衛所督導","專任工程人員督察","機關工督","監造技師督察"];
const S={db:null,user:null,dl:null,assets:null,uid:"",projects:[],reports:[],roster:[],crews:[],machines:["挖土機:80型/120型","破碎機","傾卸貨車","鏟裝機","泵浦車"],machOpen:"",soilTypes:["B5","B2-3"],dests:["新店暫置","台北港"],machOther:false,boss:false,works:[],samples:DEFAULT_SAMPLES.slice(),samplePick:null,wkSamplePick:null,soil:{type:"",trucks:"",per:"",dest:"",manualPer:false},pid:ls.get("pid",""),view:"report",repMode:"daily",wkRepId:"",wkPick:null,loaded:false,err:"",editDays:7,
  draft:null,pick:null,search:"",flash:"",month:today().slice(0,7),busy:false,openRepId:"",woOpen:"",lb:null};
function newDraft(){return{date:today(),am:"",pm:"",nowork:"",work:"",tech:0,gen:0,lab:0,mach:{},machOther:"",soil:[],entries:[],materials:"",sample:"",notes:"",tomorrow:"",crew:{},crewOt:{},traffic:0,ot:"",photos:[],mats:[],place:"",by:ls.get("by","")}}
S.draft=newDraft();
const liveProjects=()=>S.projects.filter(p=>p.status!=="完工");
const proj=()=>S.projects.find(p=>p.id===S.pid)||liveProjects()[0]||S.projects[0]||null;
const isHour=u=>/^(時|小時|工時|hr)$/i.test(String(u||"").trim()), whoOf=n=>/工|人員|交通|指揮/.test(n||"")?"人":"台";
const SOIL_KINDS=["B5","B2-3","廢棄物"],SOIL_NOTE={"B5":"混凝土塊","B2-3":"土壤砂石","廢棄物":""};
const ptype=p=>p&&p.type||(p&&p.multi?"開口契約":"一般");
const siteOpen=s=>s.status!=="完工"&&s.status!=="結案";
const fmt=n=>{const x=Number(n);return Number.isFinite(x)?(Math.round(x*100)/100).toString():""};

function stepper(label,key,o,cb){const d=o||S.draft;if(!d[key])d[key]=0;const out=h("output",{},d[key]);
  const set=v=>{d[key]=Math.max(0,v);out.textContent=d[key];if(cb)cb()};
  return h("div",{class:"f"},label,h("div",{class:"stepper"},h("button",{type:"button","aria-label":label+"減一",onclick:()=>set(d[key]-1)},"−"),out,h("button",{type:"button","aria-label":label+"加一",onclick:()=>set(d[key]+1)},"+")));}
function seg(opts,val,on){const box=h("div",{class:"seg"});opts.forEach(o=>box.append(h("button",{type:"button","aria-pressed":String(o===val),onclick:()=>{on(o);[...box.children].forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===o)))}},o)));return box;}
function txt(label,key,ph,area){const d=S.draft;const el=h(area?"textarea":"input",{id:"f_"+key,type:area?null:"text",placeholder:ph||""});el.value=d[key]||"";if(key==="by"&&S.me){el.value=S.me;d[key]=S.me;el.readOnly=true}el.addEventListener("input",()=>{d[key]=el.value;if(key==="by")ls.set("by",el.value)});return h("label",{class:"f"},label,el);}

function dupQtyEntries(pid,date,site,code,excludeRepId){
  if(!code||code==="-"||code==="other")return [];
  const out=[];
  S.reports.forEach(r=>{
    if(r.pid!==pid||r.date!==date||r.id===excludeRepId)return;
    if((site||"")!==(r.site||""))return;
    (r.entries||[]).forEach(e=>{
      if(e.code===code&&e.qty!==""&&e.qty!==null&&e.qty!==undefined){
        out.push({by:r.by||"現場人員",qty:e.qty,unit:e.unit||"",loc:e.loc||""});
      }
    });
  });
  return out;
}
function dupWarnNode(dups){
  if(!dups||!dups.length)return null;
  const desc=dups.map(x=>"「"+(x.by||"現場人員")+"」已填 "+fmt(x.qty)+" "+x.unit+(x.loc?"（"+x.loc+"）":"")).join("、");
  return h("div",{class:"msg warn",style:"font-weight:600"},"⚠️ 提醒：本日已有 "+desc+" 填寫過本工項數量！請確認是否為不同施作位置，避免數量重複計算。");
}

function viewReport(){const p=proj(),d=S.draft,out=[];const T=ptype(p),isSoil=T==="土方暫置",isRepair=T==="機動修繕";
  if(p.status==="完工")return [h("section",{class:"card"},h("p",{class:"note"},"「"+(p.short||p.name)+"」已完工,不再接受回報。請從上方選單選擇其他工程。"))];
  if(S.editId)out.push(h("div",{class:"msg warn"},"正在修改 "+d.date+" 的回報,改完請按最下面的「送出修改」。 ",h("button",{type:"button",class:"btn",onclick:()=>{S.editId="";S.draft=newDraft();S.pick=null;render()}},"取消修改")));
  if(S.flash){out.push(h("div",{class:"msg ok"},S.flash));}
  if(!isSoil&&!isRepair&&!S.editId){
    out.push(seg(["📝 每日現場回報","📋 看每日回報及修改"],S.repMode==="weekly"?"📋 看每日回報及修改":"📝 每日現場回報",v=>{S.repMode=v.startsWith("📋")?"weekly":"daily";S.wkPick=null;S.wkSamplePick=null;render()}));
    if(S.repMode==="weekly")return out.concat(viewWeeklyQty(p));
  }
  const nwBox=[];
  if(!isSoil&&!isRepair){
    nwBox.push(h("div",{class:"f"},"今日施工狀態",seg(["正常施工","今日未施工(休假/停工)"],d.nowork?"今日未施工(休假/停工)":"正常施工",v=>{
      if(v.startsWith("今日未施工")){const wd=new Date(d.date+"T00:00:00").getDay();d.nowork=d.nowork||(wd===0?"週日休假":d.am==="雨"||d.pm==="雨"?"雨天停工":"週日休假");}
      else d.nowork="";
      render();
    })));
    if(d.nowork){
      const rtags=h("div",{class:"sug"});

async function submit(){const d=S.draft,p=proj();if(!S.db||!p)return;
  if(p.multi&&!d.site){S.err="⚠️ 請先選擇派工地點。";render();window.scrollTo(0,0);return}
  const needWx=!["土方暫置","機動修繕"].includes(ptype(p));
  const crewSum=Object.values(d.crew||{}).reduce((s,v)=>s+Number(v||0),0);
  const headSum=(Number(d.tech)||0)+(Number(d.gen)||0)+(Number(d.lab)||0)+crewSum;
  const hasMach=Object.values(d.mach||{}).some(v=>Number(v)>0)||!!(d.machOther||"").trim();
  const hasContent=!!(d.work||"").trim()||(d.photos||[]).length>0||(d.entries||[]).length>0||hasMach||!!(d.sample||"").trim()||!!(d.materials||"").trim()||(d.mats||[]).length>0||(d.soil||[]).length>0||!!(d.notes||"").trim();

  if(needWx&&(!d.am||!d.pm)&&!sameDay&&!hasContent){S.err="⚠️ 請點選「上午天氣」與「下午天氣」後再送出。";render();window.scrollTo(0,0);return}

async function saveReportPatch(r,patch,msg){
  if(!S.db||S.busy)return;

  try{
    const next=Object.assign({},r,patch,{_id:r.id,by:ls.get("by",r.by||"")||r.by||""});

function groupByDay(rs){
  const map=new Map();
  rs.forEach(r=>{
    const key=r.date+"__"+(r.site||"");
    if(!map.has(key))map.set(key,{key,date:r.date,site:r.site||"",reps:[]});
    map.get(key).reps.push(r);
  });
  const out=[];
  map.forEach(g=>{
    const reps=g.reps;
    const am=(reps.find(r=>r.am)||{}).am||"";
    const pm=(reps.find(r=>r.pm)||{}).pm||"";
    const allNowork=reps.every(r=>r.nowork);
    const nowork=allNowork?(reps[0].nowork||""):"";
    let hc=0,tech=0,gen=0,lab=0;
    const works=[],machAgg={},machOth=[],soils=[],crews=[],mats=[],samples=[],notes=[],tomorrows=[],entries=[],photoSeen=new Set(),photos=[];
    reps.forEach(r=>{
      hc+=rHeadcount(r);tech+=Number(r.tech)||0;gen+=Number(r.gen)||0;lab+=Number(r.lab)||0;
      if(r.work)r.work.split(/[、,，；;\n]/).map(s=>s.trim()).filter(Boolean).forEach(w=>{if(!works.includes(w))works.push(w)});
      Object.entries(r.mach||{}).forEach(([k,v])=>{if(Number(v)>0)machAgg[k]=(machAgg[k]||0)+Number(v)});
      if(r.machOther&&!machOth.includes(r.machOther))machOth.push(r.machOther);
      const st=soilText(r);if(st&&!soils.includes(st))soils.push(st);
      const ct=crewText(r);if(ct&&!crews.includes(ct))crews.push(ct);
      if(r.materials)r.materials.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).forEach(m=>{if(!mats.includes(m))mats.push(m)});
      (r.mats||[]).forEach(x=>{if(x&&x.name){const ms=x.name+(x.qty!==""&&x.qty!==null?" "+fmt(x.qty):"")+(x.unit||"");if(!mats.includes(ms))mats.push(ms)}});
      if(r.sample)r.sample.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!samples.includes(s))samples.push(s)});
      if(r.notes&&!notes.includes(r.notes))notes.push(r.notes);
      if(r.tomorrow&&!tomorrows.includes(r.tomorrow))tomorrows.push(r.tomorrow);
      (r.entries||[]).forEach((e,idx)=>{
        if(e.code==="-"&&e.name&&!works.includes(e.name))works.push(e.name);
        entries.push({e,r,idx});
      });
      photosOf(r).forEach(ph=>{if(!photoSeen.has(ph.url)){photoSeen.add(ph.url);photos.push(ph)}});
    });
    const machParts=Object.keys(machAgg).map(n=>{const u=machUnitOf(n);return u?u.name+" "+fmt(machAgg[n])+" "+u.unit:n+" "+fmt(machAgg[n])}).concat(machOth);
    const workStr=works.join("、");
    const eBrief=entries.filter(x=>!workStr||x.e.code!=="-").map(x=>x.e.name+(x.e.loc?"("+x.e.loc+")":"")+(x.e.qty!==""?" "+fmt(x.e.qty)+(x.e.unit||""):"")).filter(Boolean);
    const brief=nowork?"⏸ 今日未施工（"+nowork+"）":([workStr,eBrief.join("、")].filter(Boolean).join("｜")||(mats.length?"物料："+mats.join("、"):soils.length?"出土："+soils.join("、"):notes.join("；")||"無填寫施工項目"));
    out.push(Object.assign(g,{am,pm,nowork,hc,tech,gen,lab,workStr,machStr:machParts.join("、"),soilStr:soils.join("、"),crewStr:crews.join("｜"),materials:mats.join("、"),sample:samples.join("、"),notes:notes.join("；"),tomorrow:tomorrows.join("；"),entries,photos,brief}));
  });
  return out;
}

        qIn));

const GAS_URL="https://script.google.com/macros/s/AKfycbzqauNWhPsZX4KZfjW7CzHs8HBUHvrVoTIse3gCobfUCSAmjFz7r5OC7q6lDHqBJmqUkg/exec";
const G={key:ls.get("gkey",""),url:(GAS_URL&&GAS_URL.indexOf("__")!==0)?GAS_URL:ls.get("gurl",""),items:{},rep:new Map(),from:"",busy:false,
  ensure(m){if(!G.from||m>=G.from||G.busy||S.demo)return;G.busy=true;const old=G.from;api("reports",{from:m,to:prevMonth(old)}).then(j=>{j.reports.forEach(r=>G.rep.set(r.id,r));G.from=m;pushReports();}).catch(()=>{}).finally(()=>{G.busy=false;render()})}};
function prevMonth(m){const a=m.split("-").map(Number);const d=new Date(a[0],a[1]-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
async function api(action,body){let r;try{r=await fetch(G.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:G.key,action},body||{}))})}catch(e){throw new Error("連不到後台,請檢查網路")}
  let j;try{j=await r.json()}catch(e){throw new Error("後台回應格式不對,請確認後台網址")}if(!j.ok)throw new Error(j.error||"後台錯誤");return j}
function pushReports(){S.real=[...G.rep.values()];if(!S.demo)S.reports=S.real}
function applyLoad(j){S.me=j.legacy?"":(j.me||"");S.legacy=!!j.legacy;S.role=j.role||"";if(S.me)ls.set("by",S.me);if(j.items)G.items=j.items;const sites={},info={};(j.sites||[]).forEach(s=>{const o=Object.assign({name:s[1],status:s[2]||"施工中"},s[3]||{});(info[s[0]]=info[s[0]]||[]).push(o);if(siteOpen(o))(sites[s[0]]=sites[s[0]]||[]).push(s[1])});
  S.projects=j.projects.map(a=>{const its=(G.items[a.id]||[]).map(x=>({code:x[0],name:x[1],unit:x[2],price:x[3],qty:x[4],cat:x[5]||"未分類",mode:x[6],basis:x[7],prog:x[8],base:x[9],on:x[10]}));const cats=[];its.forEach(i=>{if(!cats.some(c=>c.code===i.cat))cats.push({code:i.cat,name:i.cat})});
    return Object.assign({},a,{items:its,cats,active:its.filter(i=>i.on).map(i=>i.code),sites:sites[a.id]||[],siteInfo:info[a.id]||[],dispatch:(j.dispatch||{})[a.id]||{},sums:(j.sums||{})[a.id]||{},note:a.status==="未開工"?(a.note||"尚未開工"):""})});
  const c=j.config||{};S.roster=c.workers||[];S.crews=(c.crews||[]).filter(x=>x!=="菲吉");if((c.machines||[]).length){S.machines=c.machines.map(x=>String(x).replace(/^怪手/,"挖土機"));if(!S.machines.some(x=>x.startsWith("鏟裝機")))S.machines.push("鏟裝機")}S.works=(c.works||[]).filter(w=>!REMOVED_WORKS.includes(w));if((c.dests||[]).length)S.dests=c.dests;if((c.soilTypes||[]).length)S.soilTypes=c.soilTypes.map(x=>x==="垃圾"?"廢棄物":x);S.samples=(c.samples&&c.samples.length)?c.samples.filter(s=>!/^混凝土\s*(140|210|280)/.test(s)):DEFAULT_SAMPLES.slice();
  S.admin=j.role==="admin";S.canOffice=S.admin||j.role==="office";S.canWrite=S.admin;S.canEdit=S.admin;S.editDays=j.editDays||7;S.stale=j.stale||[];
  const keep=new Map();G.rep.forEach((r,id)=>{if(r.date.slice(0,7)<j._from)keep.set(id,r)});j.reports.forEach(r=>keep.set(r.id,r));G.rep=keep;pushReports()}
async function reload(lite){const from=G.from||prevMonth(today().slice(0,7));const j=await api("load",{from,to:"9999-12",lite:!!lite});j._from=from;G.from=from;applyLoad(j);try{const snap=Object.assign({},j,{items:G.items});ls.set("agy_cache_v2",JSON.stringify(snap))}catch(e){}S.loaded=true;render()}
function setActiveLocal(pid,codes){(G.items[pid]||[]).forEach(x=>{x[10]=codes.includes(x[0])?1:0})}
const gdb={collection:()=>({add:async d=>{const data=Object.assign({},d);const id=data._id||"";delete data._id;const j=await api("report",{id,data});await reload(true);return{id:j.id}}}),
  doc:path=>{const parts=path.split("/"),c=parts[0],id=parts[1];return{
    update:async u=>{if(c==="projects"){if(u.sites)await api("addSite",{pid:id,sites:u.sites});if(u.active){await api("setActive",{pid:id,active:u.active});setActiveLocal(id,u.active)}if(u.status)await api("saveProject",{project:{id,status:u.status}});if(u.machines!==undefined)await api("saveProject",{project:{id,machines:u.machines}})}await reload(true)},
    set:async v=>{if(c==="config")await api("saveConfig",{config:v});else if(c==="projects")await api("saveProject",{project:Object.assign({},v,id==="new"?{}:{id})});await reload(true)},
    delete:async()=>{await api("deleteReport",{id,by:ls.get("by","")});G.rep.delete(id);await reload(true)}}}};
function photoUrl(v){const m=String(v||"").match(/\/d\/([^/]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w400":String(v||"")}
function photoUrlLarge(v){const m=String(v||"").match(/\/d\/([^/]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600":String(v||"")}
let photoSeq=0;
const gassets={upload:(file,label,cDate,cSite)=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("讀不到照片"));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error("照片格式不支援"));img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  const data=cv.toDataURL("image/jpeg",0.8).split(",")[1];api("upload",photoMeta(data,label,cDate,cSite)).then(j=>res({id:j.url,url:j.url})).catch(rej)};img.src=fr.result};fr.readAsDataURL(file)})};
function photoMeta(data,label,cDate,cSite){const p=proj()||{},d=S.draft||{},k=S.pick||{};const t=new Date();const hh=[t.getHours(),t.getMinutes(),t.getSeconds()].map(x=>String(x).padStart(2,"0")).join("")+"_"+(++photoSeq);
  const dt=cDate||d.date||today(),st=cSite!==undefined?cSite:(d.site||"");
  const tag=String(label||(k.code&&k.code!=="-"?k.code+"_"+k.name:k.name)||d.work||"現場照片").replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,45);
  return{data,mime:"image/jpeg",project:p.short||p.name||"",date:dt,name:[dt,st,tag,hh].filter(Boolean).join("_")+".jpg"}}
const gdl={save:async({filename,data})=>{const type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";const b=data instanceof Blob?data:new Blob([data],{type});
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare){try{const f=new File([b],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:"saved"}}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}
  const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:"saved"}}};
function logout(){ls.set("gkey","");ls.set("agy_cache_v2","");G.key="";S.loaded=false;S.me="";S.boss=false;try{location.hash=""}catch(e){}const lo=$("#logout");if(lo)lo.hidden=true;const eb=$("#exitBoss");if(eb)eb.hidden=true;gate("")}
async function changePinUI(){const o=prompt("請輸入目前的 PIN");if(!o)return;const n=prompt("請輸入新的 PIN(4~20 碼)");if(!n)return;try{const j=await api("changePin",{oldPin:o,newPin:n});G.key=j.token;ls.set("gkey",G.key);alert("PIN 已更新")}catch(e){alert(e.message)}}
function gate(msg,pre){const main=$("#main");const first=!!(pre&&pre.needSet);const needUrl=!(GAS_URL&&GAS_URL.indexOf("__")!==0);
  const u=h("input",{id:"g_url",type:"text",placeholder:"https://script.google.com/macros/s/…/exec"});u.value=G.url||"";
  const nm=h("input",{id:"g_name",type:"text",autocomplete:"username",placeholder:"您的姓名(需先由管理者建立)"});nm.value=first?pre.name:ls.get("by","");if(first)nm.readOnly=true;
  const pn=h("input",{id:"g_pin",type:"password",autocomplete:"current-password",placeholder:"PIN 碼"});
  const np=h("input",{id:"g_np",type:"password",autocomplete:"new-password",placeholder:"設定新 PIN(4~20 碼)"});
  const np2=h("input",{id:"g_np2",type:"password",autocomplete:"new-password",placeholder:"再輸入一次新 PIN"});
  const go=async()=>{G.url=needUrl?u.value.trim():G.url;const name=nm.value.trim(),pin=pn.value;
    if(!G.url||!name||(first?!np.value:!pin)){gate("請填好再按進入。",pre);return}
    const body={action:"login",name,pin};
    if(first){if(np.value!==np2.value){gate("兩次輸入的新 PIN 不一致。",pre);return}body.newPin=np.value}
    main.replaceChildren(h("section",{class:"card"},h("p",{class:"note"},"登入中…")));
    try{const r=await fetch(G.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const j=await r.json();
      if(!j.ok){if(j.error==="不支援的動作"&&pin){G.key=pin;ls.set("gkey",G.key);ls.set("by",name);if(needUrl)ls.set("gurl",G.url);await reload(false);return}gate(j.error||"登入失敗",pre);return}
      if(j.needSetPin){gate("這是您第一次登入,請設定自己的 PIN(4~20 碼,請牢記)。",{name:j.name,needSet:true});return}
      G.key=j.token;ls.set("gkey",G.key);ls.set("by",j.name);if(needUrl)ls.set("gurl",G.url);await reload(false)
    }catch(e){gate(e.message&&e.message!=="Failed to fetch"?e.message:"連不到後台,請檢查網路",pre)}};
  [pn,np2].forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter")go()}));
  main.replaceChildren(h("section",{class:"card"},h("h2",{},"登入"),msg?h("div",{class:"msg warn"},msg):null,needUrl?h("label",{class:"f"},"後台網址",u):null,h("label",{class:"f"},"姓名",nm),first?h("label",{class:"f"},"新 PIN",np):h("label",{class:"f"},"PIN 碼",pn),first?h("label",{class:"f"},"確認新 PIN",np2):null,h("button",{type:"button",class:"btn primary block",onclick:go},first?"設定並進入":"登入")))}
(async function boot(){S.g=G;S.db=gdb;S.dl=gdl;S.assets=gassets;S.user={};
  if(!G.url||!G.key){gate("");return}
  const rawCache=ls.get("agy_cache_v2","");
  if(rawCache){try{const cj=JSON.parse(rawCache);if(cj&&cj.projects){G.from=cj._from||prevMonth(today().slice(0,7));applyLoad(cj);S.loaded=true;render()}}catch(e){}}
  try{await reload(false)}catch(e){if(!S.loaded)gate(e.message==="auth"?"登入已失效或帳號已停用,請重新登入。":e.message);else if(e.message==="auth"){ls.set("agy_cache_v2","");S.loaded=false;gate("登入已失效或帳號已停用,請重新登入。")}}
})();
