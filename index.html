<title>松青現場回報</title>

<style>
/* Layout: one-column phone app. Sticky project bar on top, four views switched by a bottom tab bar, big thumb-sized buttons. */
:root{
  --bg:#eef0ee; --card:#ffffff; --ink:#1c2a33; --mute:#5f6e77; --line:#d3d9d6;
  --accent:#0f6e6a; --accent-ink:#ffffff; --soft:#dcebe8; --warn:#b4530b; --warn-bg:#fbe9d2; --ok:#22703a; --ok-bg:#dff1e3;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"SF Mono","Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191c; --card:#1c262b; --ink:#e6ecea; --mute:#9aa8ad; --line:#33424a;
  --accent:#4fb8ae; --accent-ink:#082522; --soft:#213b3a; --warn:#f0a35a; --warn-bg:#43301a; --ok:#7fd096; --ok-bg:#1d3a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191c; --card:#1c262b; --ink:#e6ecea; --mute:#9aa8ad; --line:#33424a;
  --accent:#4fb8ae; --accent-ink:#082522; --soft:#213b3a; --warn:#f0a35a; --warn-bg:#43301a; --ok:#7fd096; --ok-bg:#1d3a26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
header b{font-size:15px;white-space:nowrap}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=number],textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:64px;resize:vertical}
main{padding-block:14px 96px;display:flex;flex-direction:column;gap:14px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{font-size:14px;margin:0;color:var(--mute);font-weight:600;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 130px;min-width:0}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:10px 4px;border:0;background:var(--card);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.step{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:40px;height:44px;border:0;background:var(--soft);font-size:20px}
.stepper output{flex:1;text-align:center;font-family:var(--num);font-size:18px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:84px}
.item .n{font-weight:600;font-size:15px;line-height:1.3;display:flex;justify-content:space-between;gap:8px}
.item .pm{font-size:20px;line-height:1;color:var(--accent)}
.item .q{font-size:12px;color:var(--mute);font-family:var(--num)}
.item.sel{border-color:var(--accent);background:var(--soft)}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%;font-size:17px;padding:14px}
.btn:disabled{opacity:.5}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.entry{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:14px}
.entry span{flex:1;min-width:0}
.entry b{font-family:var(--num)}
.entry button{border:0;background:none;color:var(--warn);font-size:18px;padding:4px 8px}
.sheet{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sheet .t{font-weight:700}
.big{font-size:22px!important;font-family:var(--num);text-align:right}
.note{font-size:13px;color:var(--mute)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.msg{padding:10px 12px;border-radius:8px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:flex}
nav button{flex:1;padding:12px 0;border:0;background:none;font-size:14px;color:var(--mute)}
nav button[aria-current=true]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
td.w{white-space:normal;min-width:180px} td.r,th.r{text-align:right;font-family:var(--num)}
.proj{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px}
.proj .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.proj .k{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.proj .k b{color:var(--ink);font-family:var(--num);font-size:16px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.cat{font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}
.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip.crewn{grid-column:span 2}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;background:var(--soft)}
.kpi b{font-family:var(--num);font-size:24px}
.kpi span{font-size:12px;color:var(--mute)}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chip{display:flex;justify-content:space-between;align-items:center;gap:2px;padding:12px 6px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:48px}
.chip b{font-family:var(--num)}
.chip.crewn input{width:60px;padding:6px;text-align:right;font-family:var(--num)}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--soft);font-size:14px}
.chip[data-v="1"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip[data-v="0.5"]{background:var(--soft);border-color:var(--accent);font-weight:600}
.cal td:first-child,.cal th:first-child{position:sticky;left:0;background:var(--card)}
.cal tbody tr{cursor:pointer}
.cal tr.on td{background:var(--soft)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pct{font-family:var(--num);font-size:28px;font-weight:700}
img.th{width:44px;height:44px;object-fit:cover;border-radius:6px}
</style>

<header><div class="wrap"><b>現場回報</b><select id="proj" aria-label="工程"></select></div></header>
<div class="wrap"><main id="main"><section class="card"><p class="note" id="boot">讀取工程資料中…</p></section></main></div>
<nav><div class="wrap">
  <button data-v="report">回報</button><button data-v="log">紀錄</button><button data-v="all">總覽</button><button data-v="set">設定</button>
</div></nav>

<script>

    h("div",{class:"row"},h("div",{class:"f"},"上午天氣",seg(WX,d.am,v=>d.am=v)),h("div",{class:"f"},"下午天氣",seg(WX,d.pm,v=>d.pm=v))),p.multi?siteNodes(p,d):null));
  out.push(h("section",{class:"card"},h("h2",{},"出工人數"),h("div",{class:"steps"},stepper("技術工","tech"),stepper("普通工","gen"),stepper("體力工","lab")),
    h("h2",{},"機具(有用到再點)"),machNodes(d)));
  const cg=h("div",{class:"crew"});S.roster.forEach(n=>{if(S.crews.includes(n)){const i=h("input",{type:"number",inputmode:"decimal",step:"any",min:"0",id:"c_"+n,"aria-label":n+"工班人數",placeholder:"0"});i.value=d.crew[n]||"";i.addEventListener("input",()=>{const v=Number(i.value);if(v>0)d.crew[n]=v;else delete d.crew[n]});cg.append(h("label",{class:"chip crewn"},h("span",{},n+"工班"),i));return}const b=h("button",{type:"button",class:"chip"});const paint=()=>{const v=d.crew[n]||0;b.dataset.v=String(v);b.replaceChildren(h("span",{},n),h("b",{},v?String(v):""))};b.addEventListener("click",()=>{const v=d.crew[n]||0;const nx=v===0?1:v===1?0.5:0;if(nx)d.crew[n]=nx;else delete d.crew[n];paint()});paint();cg.append(b)});

function projName(r){const p=S.projects.find(x=>x.id===r.pid);return (p?(p.short||p.name):"")+(r.site?"｜"+r.site:"")}

    if(vars.length&&S.machOpen===name)vars.forEach(v=>tags.append(h("button",{type:"button",class:"tag on",onclick:()=>add(v+name)},v)));});
  tags.append(h("button",{type:"button",class:"tag",onclick:()=>{S.machOther=!S.machOther;render()}},"＋其他"));
  const out=[tags];Object.keys(d.mach).filter(n=>d.mach[n]>0).forEach(n=>out.push(h("div",{class:"entry"},h("span",{},n),h("button",{type:"button","aria-label":n+"減一",onclick:()=>{d.mach[n]--;if(d.mach[n]<=0)delete d.mach[n];render()}},"−"),h("b",{},d.mach[n]+" 台"),h("button",{type:"button","aria-label":n+"加一",onclick:()=>{d.mach[n]++;render()}},"+"))));
  if(S.machOther||d.machOther)out.push(txt("其他機具","machOther","例:吊車 1 台"));return out}
function needSoil(d){return !d.soil.length&&(d.entries.some(e=>/出土/.test((e.name||"")+(e.loc||"")))||/出土/.test(d.notes||""))}
function soilSection(){const d=S.draft,k=S.soil;const sec=h("section",{class:"card",id:"soil"},h("h2",{},"出土"));if(needSoil(d))sec.append(h("div",{class:"msg warn"},"施工項目有寫到出土,請在這裡填出土車次。"));

  else out=out.concat(S.view==="prog"?viewProg():S.view==="people"?viewPeople():S.view==="log"?viewLog():S.view==="all"?viewAll():S.view==="set"?viewSet():viewReport());
  main.replaceChildren(...out);if(S.view!=="report")S.flash="";}

$("#proj").addEventListener("change",e=>{S.pid=e.target.value;ls.set("pid",S.pid);S.pick=null;S.draft.site="";render()});
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{S.view=b.dataset.v;S.pick=null;if(["report","log","all","set"].includes(S.view))try{location.hash=S.view==="set"?"items":S.view}catch(e){}render();window.scrollTo(0,0)}));
function fromHash(){const v=location.hash.split("#").filter(Boolean).pop()||"";S.boss=v==="boss"||v==="people"||v==="progress";S.view=v==="people"?"people":v==="progress"?"prog":S.boss?"all":v==="items"?"set":["report","log","all"].includes(v)?v:"report"}
window.addEventListener("hashchange",()=>{fromHash();render()});fromHash();

// ---- Google 試算表後台 ----
const GAS_URL="https://script.google.com/macros/s/AKfycbzqauNWhPsZX4KZfjW7CzHs8HBUHvrVoTIse3gCobfUCSAmjFz7r5OC7q6lDHqBJmqUkg/exec";
const G={key:ls.get("gkey",""),url:(GAS_URL&&GAS_URL.indexOf("__")!==0)?GAS_URL:ls.get("gurl",""),items:{},rep:new Map(),from:"",busy:false,
  ensure(m){if(!G.from||m>=G.from||G.busy||S.demo)return;G.busy=true;const old=G.from;api("reports",{from:m,to:prevMonth(old)}).then(j=>{j.reports.forEach(r=>G.rep.set(r.id,r));G.from=m;pushReports();}).catch(()=>{}).finally(()=>{G.busy=false;render()})}};
function prevMonth(m){const a=m.split("-").map(Number);const d=new Date(a[0],a[1]-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
async function api(action,body){let r;try{r=await fetch(G.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:G.key,action},body||{}))})}catch(e){throw new Error("連不到後台,請檢查網路")}
  let j;try{j=await r.json()}catch(e){throw new Error("後台回應格式不對,請確認後台網址")}if(!j.ok)throw new Error(j.error||"後台錯誤");return j}
function pushReports(){S.real=[...G.rep.values()];if(!S.demo)S.reports=S.real}
function applyLoad(j){if(j.items)G.items=j.items;const sites={};(j.sites||[]).forEach(s=>{if(s[2]!=="結案")(sites[s[0]]=sites[s[0]]||[]).push(s[1])});
  S.projects=j.projects.map(a=>{const its=(G.items[a.id]||[]).map(x=>({code:x[0],name:x[1],unit:x[2],price:x[3],qty:x[4],cat:x[5]||"未分類",mode:x[6],basis:x[7],prog:x[8],base:x[9],on:x[10]}));const cats=[];its.forEach(i=>{if(!cats.some(c=>c.code===i.cat))cats.push({code:i.cat,name:i.cat})});
    return Object.assign({},a,{items:its,cats,active:its.filter(i=>i.on).map(i=>i.code),sites:sites[a.id]||[],sums:(j.sums||{})[a.id]||{},note:a.status==="未開工"?(a.note||"尚未開工"):""})});
  const c=j.config||{};S.roster=c.workers||[];S.crews=c.crews||[];if((c.machines||[]).length)S.machines=c.machines;S.works=c.works||[];if((c.dests||[]).length)S.dests=c.dests;if((c.soilTypes||[]).length)S.soilTypes=c.soilTypes;
  S.admin=j.role==="admin";S.canWrite=S.admin;S.canEdit=S.admin;S.editDays=j.editDays||3;
  const keep=new Map();G.rep.forEach((r,id)=>{if(r.date.slice(0,7)<j._from)keep.set(id,r)});j.reports.forEach(r=>keep.set(r.id,r));G.rep=keep;pushReports()}
async function reload(lite){const from=G.from||prevMonth(today().slice(0,7));const j=await api("load",{from,to:"9999-12",lite:!!lite});j._from=from;G.from=from;applyLoad(j);S.loaded=true;render()}
function setActiveLocal(pid,codes){(G.items[pid]||[]).forEach(x=>{x[10]=codes.includes(x[0])?1:0})}
const gdb={collection:()=>({add:async d=>{const data=Object.assign({},d);const id=data._id||"";delete data._id;const j=await api("report",{id,data});await reload(true);return{id:j.id}}}),
  doc:path=>{const parts=path.split("/"),c=parts[0],id=parts[1];return{
    update:async u=>{if(c==="projects"){if(u.sites)await api("addSite",{pid:id,sites:u.sites});if(u.active){await api("setActive",{pid:id,active:u.active});setActiveLocal(id,u.active)}if(u.status)await api("saveProject",{project:{id,status:u.status}})}await reload(true)},
    set:async v=>{if(c==="config")await api("saveConfig",{config:v});else if(c==="projects")await api("saveProject",{project:Object.assign({},v,id==="new"?{}:{id})});await reload(true)},
    delete:async()=>{await api("deleteReport",{id,by:ls.get("by","")});G.rep.delete(id);await reload(true)}}}};
function photoUrl(v){const m=String(v||"").match(/\/d\/([^/]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w400":String(v||"")}
const gassets={upload:file=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("讀不到照片"));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error("照片格式不支援"));img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  const data=cv.toDataURL("image/jpeg",0.8).split(",")[1];api("upload",{name:today()+"_"+Date.now()+".jpg",mime:"image/jpeg",data}).then(j=>res({id:j.url,url:j.url})).catch(rej)};img.src=fr.result};fr.readAsDataURL(file)})};
const gdl={save:async({filename,data})=>{const type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";const b=data instanceof Blob?data:new Blob([data],{type});
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare){try{const f=new File([b],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:"saved"}}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}
  const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:"saved"}}};
function gate(msg){const main=$("#main");const needUrl=!(GAS_URL&&GAS_URL.indexOf("__")!==0);const u=h("input",{id:"g_url",type:"text",placeholder:"https://script.google.com/macros/s/…/exec"});u.value=G.url||"";const k=h("input",{id:"g_key",type:"text",autocomplete:"off",placeholder:"公司提供的通行碼"});
  const go=async()=>{G.url=needUrl?u.value.trim():G.url;G.key=k.value.trim();if(!G.url||!G.key){gate("請填好再按進入。");return}main.replaceChildren(h("section",{class:"card"},h("p",{class:"note"},"連線中…")));
    try{await reload(false);ls.set("gkey",G.key);if(needUrl)ls.set("gurl",G.url)}catch(e){gate(e.message==="auth"?"通行碼不正確,請再確認。":e.message)}};
  main.replaceChildren(h("section",{class:"card"},h("h2",{},"第一次使用"),msg?h("div",{class:"msg warn"},msg):null,needUrl?h("label",{class:"f"},"後台網址",u):null,h("label",{class:"f"},"通行碼",k),h("button",{type:"button",class:"btn primary block",onclick:go},"進入")))}
(async function boot(){S.g=G;S.db=gdb;S.dl=gdl;S.assets=gassets;S.user={};
  if(!G.url||!G.key){gate("");return}
  try{await reload(false)}catch(e){gate(e.message==="auth"?"通行碼已變更,請重新輸入。":e.message)}
})();
</script>
